<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f4">
<title>Memo — notes, all in one place</title>
<style>
:root{--bg:#f7f7f4;--paper:#fff;--ink:#20211f;--muted:#777970;--line:#e8e8e1;--soft:#f0f0eb;--accent:#536b54;--accent-light:#e9efe7;--shadow:0 12px 34px rgba(25,28,20,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1160px;margin:auto;min-height:100vh;padding:28px 30px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:28px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:650;letter-spacing:-.045em}.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:17px;font-weight:500}.top-note{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:42px;padding-top:30px}.sidebar{padding-top:4px}.side-label{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#92948b;margin:0 0 12px 10px}.nav{display:flex;flex-direction:column;gap:4px;margin-bottom:32px}.nav button{border:0;background:transparent;text-align:left;color:#666960;border-radius:9px;padding:10px 11px;display:flex;align-items:center;gap:11px;font-size:14px}.nav button:hover{background:#efefe9}.nav button.active{background:var(--accent-light);color:#344d36;font-weight:600}.nav .count{margin-left:auto;color:#92948b;font-size:12px;font-weight:400}.tiny-icon{width:18px;text-align:center;font-size:15px}.side-tip{border-top:1px solid var(--line);padding:16px 10px;color:#85877e;font-size:12px;line-height:1.65}.main{min-width:0}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:5px}.heading h1{font-size:30px;line-height:1.15;letter-spacing:-.055em;font-weight:620;margin:0}.heading p{color:var(--muted);margin:8px 0 0;font-size:14px}.primary{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:9px;padding:10px 15px;font-size:13px;font-weight:600;white-space:nowrap}.primary:hover{background:#435844}.toolbar{display:flex;gap:10px;margin-bottom:20px}.search{position:relative;flex:1}.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:0 13px 0 37px;outline:none;color:var(--ink)}.search input:focus,.field:focus,textarea:focus,select:focus{border-color:#a6b5a4;box-shadow:0 0 0 3px #e9efe7;outline:none}.search span{position:absolute;left:13px;top:9px;color:#898b82}.sort{border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 12px;color:#606259;font-size:13px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:23px 0 12px;color:#73766c;font-size:12px;font-weight:600}.section-head span:last-child{font-weight:400;color:#989a91}.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.note{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:17px 17px 14px;min-height:156px;display:flex;flex-direction:column;transition:border-color .15s,transform .15s;cursor:pointer}.note:hover{border-color:#c9cfc4;transform:translateY(-1px)}.note.pinned{border-top:2px solid #8ca18a;padding-top:16px}.note-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}.tag{font-size:10px;text-transform:uppercase;letter-spacing:.075em;font-weight:650;padding:4px 7px;border-radius:5px;background:#f1f1ec;color:#73756b}.tag.school{background:#edf1fa;color:#586b91}.tag.personal{background:#f8efe7;color:#9a6b45}.tag.random{background:#f1edf8;color:#80679a}.pin{margin-left:auto;border:0;background:transparent;color:#a5a69f;padding:0 3px;font-size:15px}.pin.on{color:var(--accent)}.note h3{font-size:16px;letter-spacing:-.025em;margin:0 0 6px;font-weight:620;line-height:1.35}.note p{font-size:13px;color:#74766e;line-height:1.55;margin:0;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}.note-foot{display:flex;justify-content:space-between;gap:10px;color:#a0a197;font-size:11px;margin-top:auto;padding-top:17px}.empty{grid-column:1/-1;text-align:center;border:1px dashed #d9dbd2;border-radius:12px;padding:50px 20px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.empty button{margin-top:14px}.overlay{position:fixed;inset:0;background:rgba(24,26,22,.32);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.overlay.show{display:flex}.editor{background:#fff;width:min(570px,100%);border-radius:15px;box-shadow:0 25px 80px rgba(0,0,0,.18);padding:24px}.editor-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.editor-head h2{font-size:19px;letter-spacing:-.04em;margin:0}.close{border:0;background:var(--soft);border-radius:8px;width:32px;height:32px;font-size:18px;color:#686b62}.form-row{display:flex;gap:12px}.form-group{display:flex;flex-direction:column;gap:7px;margin-bottom:15px;flex:1}.form-group label{font-size:12px;color:#73766d;font-weight:600}.field,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink)}textarea{resize:vertical;min-height:180px;line-height:1.6}.editor-actions{display:flex;align-items:center;gap:8px;margin-top:20px}.delete{border:0;background:transparent;color:#a24e45;padding:9px 5px;font-size:13px}.save{margin-left:auto}.secondary{border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:#fff;color:#5e6058;font-size:13px}.status{font-size:12px;color:#9a9c92;margin-top:20px;text-align:center}.mobile-nav{display:none}
@media(max-width:720px){.app{padding:18px 16px 30px}.top{padding-bottom:18px}.top-note{display:none}.layout{display:block;padding-top:20px}.sidebar{display:none}.mobile-nav{display:flex;gap:6px;overflow:auto;padding-bottom:18px;margin-bottom:23px;border-bottom:1px solid var(--line)}.mobile-nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;color:#666960;font-size:12px}.mobile-nav button.active{background:var(--accent-light);border-color:#dce5d8;color:#344d36}.heading h1{font-size:26px}.heading p{font-size:13px}.primary{padding:9px 11px}.notes{grid-template-columns:1fr}.note{min-height:140px}.toolbar{gap:7px}.sort{max-width:110px}.editor{padding:19px}.form-row{display:block}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark">m</div> memo</div>
    <div class="top-note">A little space for everything.</div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <p class="side-label">Workspace</p>
      <nav class="nav" id="desktopNav">
        <button class="active" data-filter="all"><span class="tiny-icon">▤</span> All notes <span class="count" id="countAll">0</span></button>
        <button data-filter="school"><span class="tiny-icon">⌑</span> School <span class="count" id="countSchool">0</span></button>
        <button data-filter="personal"><span class="tiny-icon">◷</span> Personal <span class="count" id="countPersonal">0</span></button>
        <button data-filter="random"><span class="tiny-icon">✳</span> Random stuff <span class="count" id="countRandom">0</span></button>
        <button data-filter="pinned"><span class="tiny-icon">⌑</span> Pinned</button>
      </nav>
      <div class="side-tip">Your thoughts, your way.<br>Notes stay in this browser on this device.</div>
    </aside>
    <main class="main">
      <nav class="mobile-nav" id="mobileNav">
        <button class="active" data-filter="all">All notes</button><button data-filter="school">School</button><button data-filter="personal">Personal</button><button data-filter="random">Random stuff</button><button data-filter="pinned">Pinned</button>
      </nav>
      <div class="heading">
        <div><div class="eyebrow" id="eyebrow">YOUR WORKSPACE</div><h1 id="pageTitle">All notes</h1><p id="pageSubtitle">School, plans, and everything in between.</p></div>
        <button class="primary" id="newBtn">＋ New note</button>
      </div>
      <div class="toolbar">
        <div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search your notes…" aria-label="Search notes"></div>
        <select class="sort" id="sort" aria-label="Sort notes"><option value="updated">Recently edited</option><option value="created">Date created</option><option value="title">Title A–Z</option></select>
      </div>
      <div id="noteArea"></div>
      <div class="status">Simple by design · Autosaves on this device</div>
    </main>
  </div>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
  <form class="editor" id="noteForm">
    <div class="editor-head"><h2 id="editorTitle">New note</h2><button type="button" class="close" id="closeBtn" aria-label="Close">×</button></div>
    <div class="form-group"><label for="title">TITLE</label><input class="field" id="title" maxlength="120" placeholder="Give this note a name…" required></div>
    <div class="form-row">
      <div class="form-group"><label for="category">CATEGORY</label><select id="category"><option value="school">School</option><option value="personal">Personal</option><option value="random">Random stuff</option></select></div>
      <div class="form-group"><label for="pinCheck">PIN NOTE</label><select id="pinCheck"><option value="no">No</option><option value="yes">Yes, keep it at the top</option></select></div>
    </div>
    <div class="form-group"><label for="body">YOUR NOTE</label><textarea id="body" placeholder="Start writing…"></textarea></div>
    <div class="editor-actions"><button type="button" class="delete" id="deleteBtn" hidden>Delete note</button><button type="button" class="secondary" id="cancelBtn">Cancel</button><button class="primary save" type="submit">Save note</button></div>
  </form>
</div>
<script>
(() => {
 const KEY='memo-notes-v1';
 let notes=[];
 try { notes=JSON.parse(localStorage.getItem(KEY)||'[]'); if(!Array.isArray(notes)) notes=[]; } catch { notes=[]; }
 let filter='all', editingId=null;
 const $=id=>document.getElementById(id);
 const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const persist=()=>localStorage.setItem(KEY,JSON.stringify(notes));
 const fmt=t=>new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(new Date(t));
 const categoryName=c=>({school:'School',personal:'Personal',random:'Random stuff'}[c]||'Random stuff');
 function setFilter(next){filter=next;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));const names={all:['All notes','YOUR WORKSPACE','School, plans, and everything in between.'],school:['School','YOUR CATEGORIES','Classes, homework, and things to remember.'],personal:['Personal','YOUR CATEGORIES','Plans, lists, and notes just for you.'],random:['Random stuff','YOUR CATEGORIES','Loose thoughts and wonderfully random things.'],pinned:['Pinned notes','QUICK ACCESS','The notes you want close at hand.']};$('pageTitle').textContent=names[filter][0];$('eyebrow').textContent=names[filter][1];$('pageSubtitle').textContent=names[filter][2];render();}
 function render(){
  $('countAll').textContent=notes.length;
  ['school','personal','random'].forEach(c=>$('count'+c[0].toUpperCase()+c.slice(1)).textContent=notes.filter(n=>n.category===c).length);
  const q=$('search').value.trim().toLowerCase(), sort=$('sort').value;
  let list=notes.filter(n=>(filter==='all'||(filter==='pinned'?n.pinned:n.category===filter))&&(!q||(n.title+' '+n.body+' '+categoryName(n.category)).toLowerCase().includes(q)));
  list.sort((a,b)=>Number(b.pinned)-Number(a.pinned)||(sort==='title'?a.title.localeCompare(b.title):sort==='created'?b.created-a.created:b.updated-a.updated));
  const area=$('noteArea');
  if(!list.length){area.innerHTML=`<div class="notes"><div class="empty"><strong>${q?'No matching notes':'Nothing here just yet'}</strong>${q?'Try a different search.':'Make a note of it before it slips away.'}<br><button class="primary" id="emptyNew">＋ Create a note</button></div></div>`;$('emptyNew').onclick=()=>openEditor();return;}
  let pinned=list.filter(n=>n.pinned), rest=list.filter(n=>!n.pinned);
  const card=n=>`<article class="note ${n.pinned?'pinned':''}" data-id="${n.id}" tabindex="0" role="button" aria-label="Edit ${safe(n.title)}"><div class="note-top"><span class="tag ${n.category}">${safe(categoryName(n.category))}</span><button class="pin ${n.pinned?'on':''}" data-pin="${n.id}" title="${n.pinned?'Unpin':'Pin'} note" aria-label="${n.pinned?'Unpin':'Pin'} note">${n.pinned?'◆':'◇'}</button></div><h3>${safe(n.title)}</h3><p>${safe(n.body||'No extra details.')}</p><div class="note-foot"><span>${n.updated!==n.created?'Edited':'Created'} ${fmt(n.updated)}</span><span>${n.body.trim()?n.body.trim().split(/\s+/).length+' words':'Empty note'}</span></div></article>`;
  area.innerHTML=(pinned.length?`<div class="section-head"><span>PINNED</span><span>${pinned.length} ${pinned.length===1?'note':'notes'}</span></div><div class="notes">${pinned.map(card).join('')}</div>`:'')+(rest.length?`<div class="section-head"><span>${pinned.length?'ALL OTHER NOTES':filter==='pinned'?'PINNED':'YOUR NOTES'}</span><span>${rest.length} ${rest.length===1?'note':'notes'}</span></div><div class="notes">${rest.map(card).join('')}</div>`:'');
  area.querySelectorAll('.note').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('[data-pin]'))return;openEditor(el.dataset.id)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEditor(el.dataset.id)}})});
  area.querySelectorAll('[data-pin]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const n=notes.find(n=>n.id===b.dataset.pin);if(n){n.pinned=!n.pinned;n.updated=Date.now();persist();render()}}));
 }
 function openEditor(id=null){editingId=id;const n=notes.find(n=>n.id===id);$('editorTitle').textContent=n?'Edit note':'New note';$('title').value=n?.title||'';$('category').value=n?.category||(['school','personal','random'].includes(filter)?filter:'school');$('pinCheck').value=n?.pinned?'yes':'no';$('body').value=n?.body||'';$('deleteBtn').hidden=!n;$('overlay').classList.add('show');setTimeout(()=>$('title').focus(),30)}
 function closeEditor(){$('overlay').classList.remove('show');editingId=null}
 $('newBtn').onclick=()=>openEditor();$('closeBtn').onclick=closeEditor;$('cancelBtn').onclick=closeEditor;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeEditor()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor()});
 $('noteForm').addEventListener('submit',e=>{e.preventDefault();const now=Date.now(),title=$('title').value.trim();if(!title)return;const existing=notes.find(n=>n.id===editingId);if(existing){Object.assign(existing,{title,category:$('category').value,pinned:$('pinCheck').value==='yes',body:$('body').value,updated:now})}else{notes.push({id:crypto.randomUUID?crypto.randomUUID():String(now)+Math.random(),title,category:$('category').value,pinned:$('pinCheck').value==='yes',body:$('body').value,created:now,updated:now})}persist();closeEditor();render()});
 $('deleteBtn').onclick=()=>{if(!editingId)return;const n=notes.find(n=>n.id===editingId);if(n&&confirm(`Delete “${n.title}”? This cannot be undone.`)){notes=notes.filter(n=>n.id!==editingId);persist();closeEditor();render()}};
 document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>setFilter(b.dataset.filter)));
 $('search').addEventListener('input',render);$('sort').addEventListener('change',render);
 render();
})();
</script>
</body>
</html>
